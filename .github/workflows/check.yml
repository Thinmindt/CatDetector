name: check

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      # The tests extract frames from real clips through ffmpeg; cv2 needs libGL.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      # picamera2 is an apt package on Raspberry Pi OS only; the suite stubs it.
      - run: uv sync --locked
      - run: bash scripts/check.sh
