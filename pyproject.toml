[project]
name = "cat-detector"
version = "0.1.0"
description = "Raspberry Pi camera monitor: motion-triggered recording plus a live MJPEG web stream."
license = "MIT"
license-files = ["LICENSE"]
# Pinned to the interpreter the OS ships. python3-libcamera is an ABI-tagged apt
# package (_libcamera.cpython-313-aarch64-linux-gnu.so) and libcamera is not on
# PyPI, so the OS picks the Python version, not us. Raspberry Pi OS trixie = 3.13.
requires-python = "==3.13.*"

# NOTE: picamera2 and libcamera are deliberately absent. They are not installable
# from PyPI (libcamera ships compiled Python bindings built against the system
# libcamera) and must come from apt via the venv's system-site-packages. See README.
dependencies = [
    "flask>=3.0",
    "numpy>=2.2,<3",
    # opencv-python 5.x resolves cleanly but is a major bump from the 4.11 this
    # project has been running on. Unpin deliberately, not by accident.
    "opencv-python>=4.11,<5",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "codespell==2.4.3",
    "mypy>=1.18",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.14",
    "shellcheck-py==0.11.0.1",
]

[tool.uv]
# picamera2 is an apt package built against /usr/bin/python3.13. A uv-managed
# CPython download would not see it, so never let uv pick one.
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ and config.py are top-level modules of an application, not an installed
# package, so the repo root has to be importable.
pythonpath = ["."]
# A regression that wedges a thread must fail the suite, not hang it forever.
addopts = "-q --strict-markers --timeout=60"
# tests/manual holds hardware smoke scripts that grab the real camera. They are
# named check_*.py so they match none of pytest's collection globs. That is
# structural, unlike norecursedirs, which does not stop an explicitly named path
# and also discards pytest's own default exclusions.

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
    "C90",  # mccabe complexity -- pushes extraction over long commented blocks
    "PLR2004",  # magic value in comparison -- name it instead
    "LOG",  # logging call correctness
    "G",    # no f-strings in log calls; keep formatting lazy
    "TRY",  # exception antipatterns
    "PTH",  # pathlib over os.path
    "RET",  # simplify returns
    "ARG",  # unused arguments
    "S",    # bandit security checks
    # Each of these reported nothing when adopted; they guard the future for free.
    "N",    # pep8 naming
    "A",    # no shadowing builtins
    "ERA",  # no commented-out code
    "PIE",  # misc: no unnecessary pass, no duplicate class fields, ...
    "PERF",  # comprehensions and list.extend over loops with append
    "FURB",  # modern idioms
    "ISC",  # implicit string concatenation
    "TID",  # no relative imports
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "FLY",  # f-strings over static joins
    "RSE",  # raise without redundant parentheses
]
ignore = [
    # A clear ValueError message at the raise site beats a bespoke exception
    # class in a project this size.
    "TRY003",
]

[tool.ruff.lint.mccabe]
# Set to the current worst function, so new complexity has to be extracted
# rather than absorbed. Raise it deliberately, never to make a warning go away.
max-complexity = 5

# The camera stack is the capture side's alone: the review side must import
# without it, so it can run on a machine that has no camera.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"picamera2".msg = "only src/capture may import the camera stack"

[tool.ruff.lint.per-file-ignores]
"src/capture/**" = ["TID251"]
"tests/manual/**" = ["TID251"]  # hardware smoke scripts
# In tests the literals *are* the expected values -- naming HTTP 200 or a frame
# count adds indirection without meaning. S101 is `assert`, which is how pytest
# works at all.
"tests/**" = [
    "S101",     # assert is how pytest works
    "PLR2004",  # assertion literals are the expected values
    "ARG",      # fixtures and stub callbacks are unused by design
    "S108",     # a fake /tmp path in an env-var test touches no filesystem
    "TID251",   # the conftest fakes the camera stack
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true

# Neither picamera2 nor its libcamera bindings are typed or PEP 561 marked.
[[tool.mypy.overrides]]
module = ["picamera2.*", "libcamera.*"]
ignore_missing_imports = true
follow_imports = "skip"
