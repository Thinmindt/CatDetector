[project]
name = "cat-detector"
version = "0.1.0"
description = "Raspberry Pi camera monitor: motion-triggered recording plus a live MJPEG web stream."
# Pinned to the interpreter the OS ships. python3-libcamera is an ABI-tagged apt
# package (_libcamera.cpython-313-aarch64-linux-gnu.so) and libcamera is not on
# PyPI, so the OS picks the Python version, not us. Raspberry Pi OS trixie = 3.13.
requires-python = "==3.13.*"

# NOTE: picamera2 and libcamera are deliberately absent. They are not installable
# from PyPI (libcamera ships compiled Python bindings built against the system
# libcamera) and must come from apt via the venv's system-site-packages. See README.
dependencies = [
    "flask>=3.0",
    "numpy>=2.2,<3",
    # opencv-python 5.x resolves cleanly but is a major bump from the 4.11 this
    # project has been running on. Unpin deliberately, not by accident.
    "opencv-python>=4.11,<5",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.uv]
# picamera2 is an apt package built against /usr/bin/python3.13. A uv-managed
# CPython download would not see it, so never let uv pick one.
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ and config.py are top-level modules of an application, not an installed
# package, so the repo root has to be importable.
pythonpath = ["."]
addopts = "-q --strict-markers"
# tests/manual holds hardware smoke scripts. They grab the real camera, so they
# are run by hand (python tests/manual/<script>.py), never collected by pytest.
norecursedirs = ["manual"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
pretty = true

# Neither picamera2 nor its libcamera bindings are typed or PEP 561 marked.
[[tool.mypy.overrides]]
module = ["picamera2.*", "libcamera.*"]
ignore_missing_imports = true
follow_imports = "skip"
